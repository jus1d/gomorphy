version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jus1d/gomorphy

linters-settings:
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: unused-parameter
      - name: error-return
      - name: error-strings

issues:
  max-same-issues: 0
